<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Diseinurako Laguntzailea - ANECA Analisi Globala</title>

    <!-- ✅ FAVICON REFERENCES -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <!-- ✅ TAILWIND DESKARGATUA -->
    <link href="css/tailwind.css" rel="stylesheet">
    
    <!-- ✅ GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
            body { font-family: 'Inter', sans-serif; }
            .form-select, .form-input, .form-textarea {
                width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem;
            }
            .btn-primary { background-color: #4f46e5; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; }
            .btn-primary:hover { background-color: #4338ca; }
            .loader { border: 2px solid #f3f3f3; border-top: 2px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .result-section { background-color: white; padding: 1.5rem; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); margin-bottom: 1.5rem; }
            .competence-card { border-left: 4px solid #4f46e5; background-color: #f8fafc; }
            .hueco-alto { border-left-color: #ef4444; background-color: #fef2f2; }
            .hueco-medio { border-left-color: #f59e0b; background-color: #fffbeb; }
            .hueco-bajo { border-left-color: #10b981; background-color: #f0fdf4; }
            .tab-button { padding: 0.75rem 1.5rem; border: none; background: #f3f4f6; cursor: pointer; border-radius: 0.375rem 0.375rem 0 0; }
            .tab-button.active { background: #4f46e5; color: white; }
        </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app">
        <div class="container mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">
            <!-- ... (contenido anterior se mantiene igual) ... -->
        </div>
    </div>

   <script type="module" src="analysis/aneca-api.js"></script>
    <script type="module" src="analysis/competence-mapper.js"></script>
    <script type="module" src="visualization/gap-analyzer.js"></script>
    <script type="module" src="analysis/curriculum-coverage.js"></script>
    <script type="module" src="analysis/horizontal-coherence.js"></script>
    <script type="module" src="analysis/content-alignment.js"></script>
    <script type="module" src="validation/aneca-validator.js"></script>
    <script type="module" src="visualization/matrix-display.js"></script>
    <script type="module" src="analysis/global-analyzer.js"></script>

    <!-- ✅ MÓDULOS PRINCIPALES - como módulos ES6 -->
    <script type="module" src="services/data-service.js"></script>
    <script type="module" src="utils/ui-helpers.js"></script>

    <!-- ✅ MAIN.JS como módulo ES6 -->
    <script type="module" src="js/main.js"></script>

    <!-- ✅ TU CÓDIGO PERSONALIZADO -->
    <script>
    // Estados del análisis global
    let isGlobalAnalysisRunning = false;
    
    // Sistema de pestañas
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ Analisi Globala modulua prest!');
        
        // Verificar qué módulos se cargaron correctamente
        console.log('🔍 Módulos cargados:');
        console.log('- AnecaAPI:', typeof AnecaAPI);
        console.log('- CompetenceMapper:', typeof CompetenceMapper);
        console.log('- GapAnalyzer:', typeof GapAnalyzer);
        console.log('- DataService:', typeof DataService);
        
        // Configurar pestañas (código anterior...)
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanels = document.querySelectorAll('.tab-panel');
        
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.getAttribute('data-tab');
                
                // Actualizar botones
                tabButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Actualizar paneles
                tabPanels.forEach(panel => panel.classList.add('hidden'));
                document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
            });
        });
        
        // Botón de análisis global
        const globalAnalysisBtn = document.getElementById('global-analysis-btn');
        const globalAnalysisText = document.getElementById('global-analysis-text');
        const globalAnalysisLoader = document.getElementById('global-analysis-loader');
        
        globalAnalysisBtn.addEventListener('click', async function() {
            if (isGlobalAnalysisRunning) return;
            
            isGlobalAnalysisRunning = true;
            globalAnalysisText.textContent = 'Analisian...';
            globalAnalysisLoader.classList.remove('hidden');
            globalAnalysisBtn.disabled = true;
            
            try {
                await initializeGlobalAnalysis();
            } catch (error) {
                console.error('❌ Error en análisis global:', error);
                showGlobalError('Errorea analisi globalean: ' + error.message);
            } finally {
                isGlobalAnalysisRunning = false;
                globalAnalysisText.textContent = '🔍 Analisi Globala Abiarazi';
                globalAnalysisLoader.classList.add('hidden');
                globalAnalysisBtn.disabled = false;
            }
        });
    });
    
    function showGlobalError(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'p-3 bg-red-100 text-red-700 border border-red-300 rounded-md mb-4';
        errorDiv.textContent = message;
        
        const tabResumen = document.getElementById('tab-resumen');
        tabResumen.insertBefore(errorDiv, tabResumen.firstChild);
    }
    
    function showAPIKeyPrompt() {
        const apiKey = prompt("Sartu zure Groq API gakoa:");
        if (apiKey) {
            localStorage.setItem('groq_api_key', apiKey);
            alert('API gakoa gordeta!');
        }
    }

    // ✅ CORREGIR: Función simplificada de análisis global
    async function initializeGlobalAnalysis() {
        console.log('🚀 ANECA Analisi Globala abiarazten...');
        
        try {
            // 1. Cargar datos del curriculum
            console.log('📥 Curriculum datuak kargatzen...');
            const curriculumData = await DataService.getCurriculumData();
            console.log('✅ Curriculum datuak kargatuta:', curriculumData);
            
            // 2. Verificar módulos disponibles
            if (typeof AnecaAPI === 'undefined') {
                throw new Error('AnecaAPI ez dago eskuragarri');
            }
            if (typeof CompetenceMapper === 'undefined') {
                throw new Error('CompetenceMapper ez dago eskuragarri');
            }
            if (typeof GapAnalyzer === 'undefined') {
                throw new Error('GapAnalyzer ez dago eskuragarri');
            }
            
            // 3. Generar competencias desde la API
            console.log('🧠 Kompetentziak interpretatzen...');
            const competencias = await AnecaAPI.interpretarCompetencias(curriculumData);
            console.log('✅ Kompetentziak interpretatuak:', competencias);
            
            // 4. Generar matriz de competencias
            console.log('📊 Kompetentzien matrizea sortzen...');
            const matrizCompetenciasRA = await CompetenceMapper.generarMatrizCompetenciasRA(curriculumData);
            console.log('✅ Kompetentzien matrizea sortuta:', matrizCompetenciasRA);
            
            // 5. Analizar huecos
            console.log('⚠️ Hobespenak analizatzen...');
            const matricesANECA = {
                RAsignaturas: { alertas: [] }, // Temporal
                competenciasRA: matrizCompetenciasRA
            };
            const analisisHuecos = GapAnalyzer.analizarHuecosCurriculares(curriculumData, matricesANECA);
            console.log('✅ Hobespenak analizatuak:', analisisHuecos);
            
            // 6. Mostrar resultados
            const resultados = {
                matrices: {
                    competenciasRA: matrizCompetenciasRA
                },
                analisisHuecos: analisisHuecos,
                ambitosProfesionales: competencias
            };
            
            window.mostrarResultadosAnalisisGlobal(resultados);
            showGlobalSuccess('✅ Analisi globala osatuta!');
            
        } catch (error) {
            console.error('❌ Error en análisis global:', error);
            throw error;
        }
    }
    
    function showGlobalSuccess(message) {
        const successDiv = document.createElement('div');
        successDiv.className = 'p-3 bg-green-100 text-green-700 border border-green-300 rounded-md mb-4';
        successDiv.textContent = message;
        
        const tabResumen = document.getElementById('tab-resumen');
        tabResumen.insertBefore(successDiv, tabResumen.firstChild);
    }

    // Función para mostrar resultados del análisis global
    window.mostrarResultadosAnalisisGlobal = function(resultados) {
        console.log('📊 Analisi globalaren emaitzak bistaratzen:', resultados);
        
        // Actualizar pestaña de resumen
        const summaryContent = document.getElementById('summary-content');
        if (resultados.ambitosProfesionales) {
            summaryContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-blue-800">🎓 Arlo Profesionalak</h4>
                        <p class="text-2xl font-bold text-blue-600">${Object.keys(resultados.ambitosProfesionales).length}</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-green-800">📈 Konpetentziak</h4>
                        <p class="text-2xl font-bold text-green-600">${resultados.matrices?.competenciasRA?.metricas?.totalCompetencias || resultados.matrices?.competenciasRA?.matriz?.competencias?.length || 0}</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-orange-800">⚠️ Hobespenak</h4>
                        <p class="text-2xl font-bold text-orange-600">${resultados.analisisHuecos?.huecos ? Object.values(resultados.analisisHuecos.huecos).flat().length : 0}</p>
                    </div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="font-semibold mb-2">🏆 Analisi Globala Osatuta</h4>
                    <p class="text-sm text-gray-600">Planaren diagnostiko osoa burutu da. Ikusi gainontzeko fitxak xehetasun gehiagorako.</p>
                </div>
            `;
        }

        // Actualizar pestaña de competencias
        const competenceContent = document.getElementById('competence-content');
        if (resultados.ambitosProfesionales) {
            let competenciasHTML = '';
            Object.entries(resultados.ambitosProfesionales).forEach(([ambito, competencias]) => {
                competenciasHTML += `
                    <div class="mb-6">
                        <h4 class="font-semibold text-lg mb-2">${ambito.replace('_', ' ').toUpperCase()}</h4>
                        <div class="space-y-2">
                            ${competencias.slice(0, 5).map(comp => `
                                <div class="competence-card p-3 rounded">
                                    <div class="font-medium">${comp.nombre}</div>
                                    <div class="text-sm text-gray-600">${comp.descripcion.substring(0, 100)}...</div>
                                    <div class="text-xs text-gray-500 mt-1">${comp.nivelBloom} • ${comp.instrumentosEvaluacion?.length || 0} ebaluazio-instrumentu</div>
                                </div>
                            `).join('')}
                            ${competencias.length > 5 ? `<div class="text-sm text-gray-500 mt-2">... eta ${competencias.length - 5} gehiago</div>` : ''}
                        </div>
                    </div>
                `;
            });
            competenceContent.innerHTML = competenciasHTML || '<p>Ez daude kompetentziak eskuragarri</p>';
        }

        // Actualizar pestaña de huecos
        const gapContent = document.getElementById('gap-content');
        if (resultados.analisisHuecos?.huecos) {
            const todosHuecos = Object.values(resultados.analisisHuecos.huecos).flat();
            if (todosHuecos.length > 0) {
                gapContent.innerHTML = todosHuecos.map(hueco => `
                    <div class="hueco-${hueco.urgencia ? hueco.urgencia.toLowerCase() : 'medio'} p-4 rounded-lg mb-3">
                        <div class="font-semibold">${hueco.tipo || 'HOBESPENA'} - ${hueco.urgencia || 'MEDIO'}</div>
                        <div class="text-sm mt-1">${hueco.descripcion || 'Deskribapenik ez'}</div>
                        <div class="text-xs text-gray-600 mt-2">${hueco.accionRecomendada || 'Ekintza zehaztugabea'}</div>
                    </div>
                `).join('');
            } else {
                gapContent.innerHTML = '<div class="bg-green-50 p-4 rounded-lg text-green-700">🎉 Ez daude hobespen kritikorik detektatu!</div>';
            }
        } else {
            gapContent.innerHTML = '<p>Hobespenen analisia ez dago eskuragarri</p>';
        }

        // Actualizar pestaña de matrices
        const matrixContent = document.getElementById('matrix-content');
        matrixContent.innerHTML = `
            <div class="matrix-grid">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="font-semibold">📊 Konpetentzien Matrizea</h4>
                    <p class="text-sm text-gray-600">${resultados.matrices?.competenciasRA?.metricas?.totalCompetencias || resultados.matrices?.competenciasRA?.matriz?.competencias?.length || 0} konpetentzia</p>
                    <div class="text-xs text-green-600 mt-1">✅ Kargatuta</div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="font-semibold">🎯 IE-Asignatura Matrizea</h4>
                    <p class="text-sm text-gray-600">Estaldura analisia</p>
                    <div class="text-xs text-yellow-600 mt-1">🔄 Prest</div>
                </div>
                <div class="bg-gray-50 p-4 rounded-lg">
                    <h4 class="font-semibold">🔗 Koherentzia Horizontala</h4>
                    <p class="text-sm text-gray-600">Asignatura arteko loturak</p>
                    <div class="text-xs text-yellow-600 mt-1">🔄 Prest</div>
                </div>
            </div>
        `;
    };
    </script>
</body>
</html>
